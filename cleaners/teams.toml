id = "teams"
name = "Microsoft Teams"
description = "Teams client: cache, logs and crash dumps (login and chat history are kept)"

[[running]]
type = "exe"
value = "teams"
os = "unix"

[[running]]
type = "exe"
value = "teams-for-linux"
os = "unix"

[[running]]
type = "exe"
value = "ms-teams.exe"
os = "windows"

[[running]]
type = "exe"
value = "Teams"
os = "macos"

[[var]]
name = "config"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.config/teams"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.config/Microsoft/Microsoft Teams"
[[var.value]]
os = "macos"
search = "glob"
value = "~/Library/Application Support/Microsoft/Teams"
[[var.value]]
os = "windows"
search = "glob"
# Classic Teams keeps its Electron profile (Cache, Code Cache, GPUCache, logs,
# Crashpad) in %APPDATA%\Microsoft\Teams, not in %LOCALAPPDATA%\Microsoft\Teams
# — the latter is the install directory (current\, packages\, Update.exe), so
# every action below used to be a no-op on Windows. New Teams is packaged
# (MSIX) and caches under %LOCALAPPDATA%\Packages\MSTeams_*, which needs its
# own layout and is not covered here.
value = '$APPDATA\Microsoft\Teams'

[[option]]
id = "cache"
label = "Cache"
description = "Delete the client, GPU and code caches"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/Cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/Code Cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/GPUCache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/ShaderCache"

[[option]]
id = "logs"
label = "Logs"
description = "Delete log files and crash dumps"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/logs"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/Crashpad"
