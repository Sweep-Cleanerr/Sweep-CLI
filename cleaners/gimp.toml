id = "gimp"
name = "GIMP"
description = "GIMP image editor cache and logs"

[[running]]
type = "exe"
value = "gimp"
os = "unix"

[[running]]
type = "exe"
value = "gimp.exe"
os = "windows"

[[running]]
type = "exe"
value = "GIMP"
os = "macos"

[[var]]
name = "gimp_data"
[[var.value]]
os = "linux"
search = "literal"
value = "~/.config/GIMP"
[[var.value]]
os = "macos"
search = "literal"
value = "~/Library/Application Support/GIMP"
[[var.value]]
os = "windows"
search = "literal"
value = '$APPDATA\GIMP'

[[option]]
id = "cache"
label = "Cache"
description = "Filter and plugin cache (personal brushes and settings are kept)"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$gimp_data$$/2.10/cache"

[[option]]
id = "logs"
label = "Logs"
description = "Error and operation logs"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$gimp_data$$/2.10/logs"
