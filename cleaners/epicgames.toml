id = "epicgames"
name = "Epic Games Launcher"
description = "Epic Games Store launcher logs and cache"

[[running]]
type = "exe"
value = "EpicGamesLauncher"
os = "windows"

[[running]]
type = "exe"
value = "EpicGamesLauncher"
os = "macos"

[[var]]
name = "epic_data"
[[var.value]]
os = "linux"
search = "literal"
value = "~/.config/Epic/EpicGamesLauncher"
[[var.value]]
os = "macos"
search = "literal"
value = "~/Library/Application Support/Epic/EpicGamesLauncher"
[[var.value]]
os = "windows"
search = "literal"
value = '$LOCALAPPDATA\Epic\EpicGamesLauncher'

[[option]]
id = "logs"
label = "Logs"
description = "Launcher and download logs"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$epic_data$$/Saved/Logs"

[[option]]
id = "cache"
label = "Cache"
description = "UI and store cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$epic_data$$/Saved/webcache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$epic_data$$/Saved/HttpCache"
