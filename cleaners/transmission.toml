id = "transmission"
name = "Transmission"
description = "Transmission BitTorrent client: log files (torrents and resume data are kept)"

[[running]]
type = "exe"
value = "transmission-daemon"
os = "unix"

[[var]]
name = "config"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.config/transmission"
# The daemon keeps its own profile (and optional transmission-daemon.log).
[[var.value]]
os = "linux"
search = "glob"
value = "~/.config/transmission-daemon"
[[var.value]]
os = "macos"
search = "glob"
value = "~/Library/Application Support/Transmission"
[[var.value]]
os = "windows"
search = "glob"
value = '$APPDATA\Transmission'

[[option]]
id = "logs"
label = "Logs"
description = "Delete Transmission log files"

[[option.action]]
command = "delete"
search = "glob"
path = "$$config$$/*.log*"
type = "f"

[[option]]
id = "cache"
label = "Cache"
description = "Delete Transmission's local cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "~/.cache/transmission"
os = "linux"

# On macOS the cache is named after the bundle id; `~/.cache/transmission`
# does not exist there, so the old action was a no-op.
[[option.action]]
command = "delete"
search = "walk.all"
path = "~/Library/Caches/org.m0k.transmission"
os = "macos"
