id = "zotero"
name = "Zotero"
description = "Zotero reference manager: caches, logs and crash reports (your library is kept)"

[[running]]
type = "exe"
value = "zotero"
os = "linux"

[[running]]
type = "exe"
value = "Zotero"
os = "macos"

[[running]]
type = "exe"
value = "zotero.exe"
os = "windows"

[[var]]
name = "data"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.zotero"
[[var.value]]
os = "macos"
search = "glob"
value = "~/Library/Application Support/Zotero"
[[var.value]]
os = "windows"
search = "glob"
value = '$APPDATA\Zotero'

[[var]]
name = "cache"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.cache/zotero"
[[var.value]]
os = "macos"
search = "glob"
value = "~/Library/Caches/Zotero"
[[var.value]]
os = "windows"
search = "glob"
value = '$LOCALAPPDATA\Zotero'

[[option]]
id = "cache"
label = "Cache"
description = "Delete Zotero's cache and startup cache"

[[option.action]]
command = "delete"
search = "glob"
path = "$$cache$$/**/cache2"
type = "d"
max_depth = 4

[[option.action]]
command = "delete"
search = "glob"
path = "$$cache$$/**/startupCache"
type = "d"
max_depth = 4

[[option.action]]
command = "delete"
search = "glob"
path = "$$data$$/**/cache2"
type = "d"
max_depth = 4

[[option.action]]
command = "delete"
search = "glob"
path = "$$data$$/**/startupCache"
type = "d"
max_depth = 4

[[option]]
id = "logs"
label = "Logs and crashes"
description = "Delete Zotero log files and crash reports"

[[option.action]]
command = "delete"
search = "glob"
path = "$$data$$/**/*.log*"
type = "f"
max_depth = 5

[[option.action]]
command = "delete"
search = "glob"
path = "$$data$$/**/crashes"
type = "d"
max_depth = 4

[[option.action]]
command = "delete"
search = "glob"
path = "$$data$$/**/Crash Reports"
type = "d"
max_depth = 3
