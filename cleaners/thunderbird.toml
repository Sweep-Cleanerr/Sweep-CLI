id = "thunderbird"
name = "Thunderbird"
description = "Email client cache and telemetry (emails and accounts are NEVER deleted)"

[[running]]
type = "exe"
value = "thunderbird"
os = "unix"

[[running]]
type = "exe"
value = "thunderbird.exe"
os = "windows"

[[var]]
name = "profile"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.thunderbird/*"
[[var.value]]
os = "macos"
search = "glob"
value = "~/Library/Thunderbird/Profiles/*"
[[var.value]]
os = "windows"
search = "glob"
value = '$APPDATA\Thunderbird\Profiles\*'

[[option]]
id = "cache"
label = "Cache"
description = "Page and add-on cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$profile$$/cache2"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$profile$$/startupCache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$profile$$/shader-cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "~/.cache/thunderbird"
os = "linux"

[[option]]
id = "crashes"
label = "Crash reports"
description = "Unsent crash reports"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$profile$$/minidumps"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$profile$$/crashes"

[[option]]
id = "telemetry"
label = "Telemetri"
description = "Telemetry and health reports"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$profile$$/datareporting"
