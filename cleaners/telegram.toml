id = "telegram"
name = "Telegram"
description = "Messaging client logs (the session and chats are kept)"

[[running]]
type = "exe"
value = "Telegram"
os = "unix"

[[running]]
type = "exe"
value = "Telegram.exe"
os = "windows"

[[var]]
name = "tdata"
[[var.value]]
os = "linux"
search = "literal"
value = "~/.local/share/TelegramDesktop"
[[var.value]]
os = "macos"
search = "literal"
value = "~/Library/Application Support/Telegram Desktop"
[[var.value]]
os = "windows"
search = "literal"
value = '$APPDATA\Telegram Desktop'

[[option]]
id = "logs"
label = "Logs"
description = "Client logs and crash dumps"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$tdata$$/logs"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$tdata$$/dumps"

[[option.action]]
command = "delete"
search = "file"
path = "$$tdata$$/log.txt"

[[option]]
id = "temp"
label = "Temporary files"
description = "Interrupted download and preview leftovers (the session and chats are kept)"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$tdata$$/temp"
