id = "onedrive"
name = "OneDrive"
description = "OneDrive sync client: logs and local cache (your synced files are never touched)"
os = "linux"

[[running]]
type = "exe"
value = "onedrive"

[[var]]
name = "config"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.config/onedrive"

[[option]]
id = "logs"
label = "Logs"
description = "Delete OneDrive client log files"

[[option.action]]
command = "delete"
search = "glob"
path = "$$config$$/*.log*"
type = "f"

[[option]]
id = "cache"
label = "Cache"
description = "Delete the client's local sync database"
warning = "The client will do a full rescan of your OneDrive on the next start."

# The client keeps its state next to its configuration: `items.sqlite3`,
# `items-dryrun.sqlite3`, `delta_link` and `refresh_token` all live in
# ~/.config/onedrive (see `onedrive --verbose`), not in ~/.local/share/onedrive
# — that directory does not exist, so both actions here used to be no-ops.
[[option.action]]
command = "delete"
search = "glob"
path = "$$config$$/items*.sqlite3*"
type = "f"
