id = "linux_journal"
name = "Systemd Journal"
description = "Size/age-budgeted vacuum of systemd journal logs (default 500M, 7 days; root required)"
os = "linux"

[[option]]
id = "vacuum"
label = "Journal vacuum"
description = "Runs journalctl --vacuum-size=500M --vacuum-time=7d; before/after are reported"

[[option.action]]
command = "system.journal_vacuum"
search = "file"
path = ""

[[option]]
id = "user_vacuum"
label = "User journal vacuum"
description = "journalctl --user --vacuum-size=500M --vacuum-time=7d (user journals only)"
warning = "Journal files are usually root-owned, so this may need root too. The system vacuum already covers user journals."

[[option.action]]
command = "system.journal_user"
search = "file"
path = ""
