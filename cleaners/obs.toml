id = "obs"
name = "OBS Studio"
description = "Streaming software logs and crash reports (scenes and profiles are kept)"

[[running]]
type = "exe"
value = "obs"
os = "unix"

[[running]]
type = "exe"
value = "obs64.exe"
os = "windows"

[[running]]
type = "exe"
value = "obs"
os = "macos"

[[var]]
name = "obs_config"
[[var.value]]
os = "linux"
search = "literal"
value = "~/.config/obs-studio"
[[var.value]]
os = "macos"
search = "literal"
value = "~/Library/Application Support/obs-studio"
[[var.value]]
os = "windows"
search = "literal"
value = '$APPDATA\obs-studio'

[[option]]
id = "logs"
label = "Logs"
description = "Stream/recording session logs"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$obs_config$$/logs"

[[option]]
id = "crashes"
label = "Crash reports"
description = "Crash dumps"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$obs_config$$/crashes"
