id = "zed"
name = "Zed"
description = "Zed editor: logs and caches (settings, extensions and workspace state are kept)"

[[running]]
type = "exe"
value = "zed"
os = "linux"

[[running]]
type = "exe"
value = "zeditor"
os = "linux"

[[running]]
type = "exe"
value = "Zed.exe"
os = "windows"

[[running]]
type = "exe"
value = "Zed"
os = "macos"

[[var]]
name = "logs"
[[var.value]]
os = "linux"
search = "literal"
value = "~/.local/share/zed/logs"
[[var.value]]
os = "macos"
search = "literal"
value = "~/Library/Logs/Zed"
[[var.value]]
os = "windows"
search = "literal"
value = '$LOCALAPPDATA\Zed\logs'

[[var]]
name = "cache"
[[var.value]]
os = "linux"
search = "literal"
value = "~/.cache/zed"
[[var.value]]
os = "macos"
search = "literal"
value = "~/Library/Caches/Zed"
[[var.value]]
os = "windows"
search = "literal"
value = '$LOCALAPPDATA\Zed\cache'

[[option]]
id = "logs"
label = "Logs"
description = "Delete editor log files (settings and extensions are kept)"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$logs$$"

[[option]]
id = "cache"
label = "Cache"
description = "Delete downloaded caches (extensions are kept)"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$cache$$"
