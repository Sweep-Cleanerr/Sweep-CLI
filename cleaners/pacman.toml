id = "pacman"
name = "pacman"
description = "Arch Linux package manager cache"
os = "linux"

[[option]]
id = "cache"
label = "Package cache"
description = "pacman -Scc: remove all cached packages"
warning = "This removes the entire package cache and cannot be undone."

[[option.action]]
command = "pacman.clean"
search = "file"
path = ""

[[option]]
id = "deep_cache"
label = "Deep cache sweep"
description = "Per-file preview of /var/cache/pacman/pkg; keeps the last 2 versions when paccache is present"

[[option.action]]
command = "system.pacman_cache"
search = "file"
path = ""
