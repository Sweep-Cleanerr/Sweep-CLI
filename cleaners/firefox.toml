id = "firefox"
name = "Firefox"
description = "Mozilla Firefox web browser: cache, history, cookies and thumbnails"

# ---- Çalışan Firefox kontrolleri ----
[[running]]
type = "exe"
value = "firefox"
os = "unix"

[[running]]
type = "exe"
value = "firefox-esr"
os = "unix"

[[running]]
type = "exe"
value = "firefox-bin"
os = "unix"

[[running]]
type = "exe"
value = "firefox.exe"
os = "windows"

[[running]]
type = "exe"
value = "firefox"
os = "macos"

# ---- Firefox profilleri ----
[[var]]
name = "profile"

[[var.value]]
os = "linux"
search = "glob"
value = "~/.mozilla/firefox/*"

[[var.value]]
os = "macos"
search = "glob"
value = "~/Library/Application Support/Firefox/Profiles/*"

[[var.value]]
os = "windows"
search = "glob"
value = '$APPDATA\Mozilla\Firefox\Profiles\*'

# ---- Cache ----
[[option]]
id = "cache"
label = "Cache"
description = "Delete the Firefox cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$profile$$/cache2"

[[option.action]]
command = "delete"
search = "walk.all"
path = "~/.cache/mozilla/firefox"
os = "linux"

# ---- Cookies ----
[[option]]
id = "cookies"
label = "Cookies"
description = "Delete cookies"
warning = "Deleting cookies will log you out of websites."

[[option.action]]
command = "cookies"
search = "file"
path = "$$profile$$/cookies.sqlite"

# ---- History ----
[[option]]
id = "history"
label = "History"
description = "Delete browsing history and download history"
warning = "This clears history but not your bookmarks."

[[option.action]]
command = "mozilla.url_history"
search = "file"
path = "$$profile$$/places.sqlite"

# ---- Session ----
[[option]]
id = "session"
label = "Session"
description = "Delete session restore data"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$profile$$/sessionstore-backups"

# ---- Thumbnails ----
[[option]]
id = "thumbnails"
label = "Thumbnails"
description = "Delete cached page thumbnails"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$profile$$/thumbnails"

# ---- Shader cache ----
[[option]]
id = "shader_cache"
label = "Shader cache"
description = "Delete GPU shader compilation cache (regenerated by the driver)"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$profile$$/shader-cache"

# ---- Form history ----
[[option]]
id = "forms"
label = "Form history"
description = "Deletes saved form entries (passwords are NEVER deleted)"

[[option.action]]
command = "delete"
search = "file"
path = "$$profile$$/formhistory.sqlite"

# ---- Site verileri ----
[[option]]
id = "site_data"
label = "Site verileri"
description = "DOM storage and IndexedDB leftovers (cookies are a separate option)"

[[option.action]]
command = "delete"
search = "file"
path = "$$profile$$/webappsstore.sqlite"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$profile$$/storage/default"

# ---- Telemetri ----
[[option]]
id = "telemetry"
label = "Telemetri"
description = "Telemetry pending submission to Mozilla and health reports"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$profile$$/datareporting"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$profile$$/healthreport"
