name: Windows binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v0.6.1

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
      - name: Build portable binaries
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:TAG.TrimStart("v")
          foreach ($target in @("x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc")) {
            cargo build --release --target $target
            $arch = $target.Split("-")[0]
            $stage = "stage-$arch"
            New-Item -ItemType Directory -Force $stage | Out-Null
            Copy-Item "target/$target/release/sweep.exe" "$stage/sweep.exe"
            Copy-Item LICENSE $stage
            Compress-Archive -Path "$stage/*" -DestinationPath "sweep-v$version-$arch-pc-windows-msvc-portable.zip"
            Copy-Item "target/$target/release/sweep.exe" "sweep-v$version-$arch-pc-windows-msvc.exe"
          }
      - name: Attach to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:TAG.TrimStart("v")
          $files = @(
            "sweep-v$version-x86_64-pc-windows-msvc-portable.zip",
            "sweep-v$version-x86_64-pc-windows-msvc.exe",
            "sweep-v$version-aarch64-pc-windows-msvc-portable.zip",
            "sweep-v$version-aarch64-pc-windows-msvc.exe"
          )
          foreach ($file in $files) {
            if (!(Test-Path $file)) { throw "missing $file" }
            gh release upload $env:TAG $file --clobber
          }
