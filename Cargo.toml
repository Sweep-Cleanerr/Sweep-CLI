[package]
name = "sweep"
version = "0.6.0"
edition = "2021"
rust-version = "1.88"
description = "Fast, preview-first system cleaner with a scriptable CLI"
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Sweep-Cleanerr/Sweep-CLI"
keywords = ["cleaner", "disk", "cache", "cli", "system"]
categories = ["command-line-utilities", "filesystem"]
build = "build.rs"

[lib]
name = "sweep"
path = "src/lib.rs"

[[bin]]
name = "sweep"
path = "src/main.rs"

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
globset = "0.4"
dirs = "5"
log = "0.4"
walkdir = "2"
rayon = "1"
regex = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap_complete = "4"
sha2 = "0.10"
quick-xml = "0.36"
sysinfo = "0.30"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
